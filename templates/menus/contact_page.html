{% extends 'base.html' %}

{% block content %}

                    <span

                        </div>
                        <div class="min-w-0 flex-1">
                            <p class="text-[10px] font-black text-blue-400 uppercase tracking-widest">Email Official</p>

                        </div>
                    </a>

                    <a href="https://wa.me/6285772747891" target="_blank"
                        class="group flex flex-col sm:flex-row items-start sm:items-center gap-4 sm:gap-6 p-4 sm:p-6 border border-white/5 hover:bg-white/5 transition-all">

                            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                                <path

                            </svg>
                        </div>

                        <div class="min-w-0 flex-1">
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">WhatsApp Line</p>
                            <p class="text-sm sm:text-lg font-bold text-white break-all">0857-7274-7891</p>

                    <div
                        class="group flex flex-col sm:flex-row items-start sm:items-center gap-4 sm:gap-6 p-4 sm:p-6 border border-white/5 hover:bg-white/5 transition-all cursor-pointer">
                        <div
                            class="w-12 h-12 md:w-14 md:h-14 bg-slate-800 flex-shrink-0 flex items-center justify-center text-white shadow-[4px_4px_0px_0px_rgba(37,99,235,0.5)]">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path
                                    d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"

                                    stroke-linejoin="round" />

                        </div>

        </div>

        <div class="lg:col-span-7" x-show="loaded" x-transition:enter="transition ease-out duration-700 delay-300"
            x-transition:enter-start="opacity-0 translate-y-10">

                            <label class="text-[10px] font-black uppercase tracking-widest text-slate-400">Full

                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-black uppercase tracking-widest text-slate-400">Email
                                Address</label>
                            <input type="email" placeholder="john@company.com"
                                class="w-full bg-slate-50 border-2 border-slate-200 p-3 sm:p-4 focus:border-blue-600 focus:bg-white outline-none transition-all font-bold text-sm">
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black uppercase tracking-widest text-slate-400">Subject
                            Solution</label>
                        <div class="relative">
                            <select
                                class="w-full bg-slate-50 border-2 border-slate-200 p-3 sm:p-4 focus:border-blue-600 focus:bg-white outline-none transition-all font-bold appearance-none text-sm">

                                <option>Infrastructure & Cloud</option>
                                <option>IT Operational Management</option>
                                <option>DevOps & Reliability</option>
                            </select>
                            <div class="absolute inset-y-0 right-4 flex items-center pointer-events-none">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path d="M19 9l-7 7-7-7" stroke-width="3" stroke-linecap="round"
                                        stroke-linejoin="round"></path>
                                </svg>
                            </div>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black uppercase tracking-widest text-slate-400">Project
                            Detail</label>
                        <textarea rows="4" placeholder="Tell us about your digital complexity..."
                            class="w-full bg-slate-50 border-2 border-slate-200 p-3 sm:p-4 focus:border-blue-600 focus:bg-white outline-none transition-all font-bold text-sm"></textarea>
                    </div>
                    <button
                        class="w-full py-4 md:py-5 bg-slate-900 text-white font-black uppercase tracking-[0.2em] md:tracking-[0.3em] hover:bg-blue-600 transition-all active:scale-[0.98] text-xs sm:text-sm">
                        Initialize Consultation
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
